name: sun24-doubly-secure

services:
  chal:
    build: ./src
    restart: unless-stopped
    ports:
    - "127.0.0.1:24401:8080"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 512

  solver:
    build: ./solver
    environment:
      - ADDRESS=chal
      - PORT=8080
    depends_on:
    - chal
    profiles:
    - solver
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 512
